# Tiny Tapeout project information
project:
  title:        "Synchronous Packet FIFO"
  author:       "Param Sharma"
  discord:      ""
  description:  "Packet-level FIFO with commit/rollback semantics, 8x8, drops malformed packets without corrupting the buffer"
  language:     "Verilog"
  clock_hz:     10000000
  tiles: "1x1"
  top_module:  "tt_um_packet_fifo"
  source_files:
    - "tt_um_packet_fifo.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "DIN0"
  ui[1]: "DIN1"
  ui[2]: "DIN2"
  ui[3]: "DIN3"
  ui[4]: "DIN4"
  ui[5]: "DIN5"
  ui[6]: "DIN6"
  ui[7]: "DIN7"
  # Outputs
  uo[0]: "DOUT0"
  uo[1]: "DOUT1"
  uo[2]: "DOUT2"
  uo[3]: "DOUT3"
  uo[4]: "DOUT4"
  uo[5]: "DOUT5"
  uo[6]: "DOUT6"
  uo[7]: "DOUT7"
  # Bidirectional pins
  uio[0]: "WR_EN"
  uio[1]: "RD_EN"
  uio[2]: "SOP"
  uio[3]: "EOP"
  uio[4]: "PKT_ERR"
  uio[5]: "FULL"
  uio[6]: "EMPTY"
  uio[7]: "DROP"

# Do not change!
yaml_version: 6
